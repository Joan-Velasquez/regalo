<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05061a">
<title>Un pequeño universo para vos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --night-0: #04050f;
  --night-1: #0b0b2e;
  --night-2: #1a1246;
  --lilac: #b9a4ff;
  --ink: #ece8ff;
  --ink-soft: rgba(236, 232, 255, .55);
  --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; margin: 0; }
html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;            
  background: var(--night-0);
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
}

/* ============ Cielo y nebulosas ============ */
.sky {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 80% 55% at 50% 118%, #2d1b6e 0%, transparent 70%),
    radial-gradient(ellipse 70% 50% at 15% 0%, #1b1552 0%, transparent 65%),
    linear-gradient(180deg, #05061a 0%, var(--night-1) 55%, var(--night-2) 100%);
}
.nebula {
  position: fixed; border-radius: 50%;
  pointer-events: none; will-change: transform;
  animation: nebula-drift 70s ease-in-out infinite alternate;
}
.nebula--violet { width: 75vmax; height: 55vmax; left: -25vmax; top: -15vmax;
  background: radial-gradient(closest-side, rgba(120, 80, 220, .34), transparent); }
.nebula--lilac { width: 65vmax; height: 45vmax; right: -22vmax; bottom: -12vmax;
  background: radial-gradient(closest-side, rgba(190, 125, 235, .22), transparent);
  animation-duration: 90s; animation-direction: alternate-reverse; }
.nebula--blue { width: 55vmax; height: 40vmax; left: 25vw; top: 35vh;
  background: radial-gradient(closest-side, rgba(60, 95, 210, .2), transparent);
  animation-duration: 110s; }
@keyframes nebula-drift { to { transform: translate3d(6vmax, 3vmax, 0) scale(1.08); } }

#starfield { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* ============ Luna ============ */
.moon {
  position: fixed;
  top: calc(8vh + env(safe-area-inset-top, 0px));
  right: 11vw;
  width: clamp(84px, 15vmin, 168px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 36% 34%, #fffdf2 0%, #ece8ff 52%, #bdb6e2 100%);
  box-shadow:
    inset -14px -10px 26px rgba(95, 85, 160, .38),
    0 0 36px rgba(225, 220, 255, .55),
    0 0 110px rgba(170, 150, 255, .3);
  z-index: 1;
}
.moon::before { /* halo amplio que "respira" */
  content: ""; position: absolute; inset: -90%;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(190, 175, 255, .26), rgba(130, 110, 230, .08) 55%, transparent);
  animation: halo-breathe 9s ease-in-out infinite;
  will-change: opacity, transform;
}
.moon::after { /* cráteres muy sutiles */
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background:
    radial-gradient(circle at 62% 30%, rgba(120, 110, 170, .22) 0 9%, transparent 10%),
    radial-gradient(circle at 40% 62%, rgba(120, 110, 170, .18) 0 13%, transparent 14%),
    radial-gradient(circle at 70% 70%, rgba(120, 110, 170, .16) 0 6%, transparent 7%);
}
@keyframes halo-breathe { 0%, 100% { opacity: .75; transform: scale(.97); } 50% { opacity: 1; transform: scale(1.04); } }

/* ============ Frase principal ============ */
.stage {
  position: fixed; inset: 0; z-index: 2;
  display: grid; place-items: center;
  padding: 0 7vw;
  pointer-events: none;        /* los toques llegan al cielo */
}
.phrase {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 300;
  font-size: clamp(1.6rem, 1rem + 3.1vw, 3.1rem);
  line-height: 1.4;
  letter-spacing: .015em;
  text-align: center;
  max-width: 19em;
  text-wrap: balance;
  text-shadow: 0 0 26px rgba(185, 164, 255, .5), 0 0 2px rgba(255, 255, 255, .25);
}
.phrase__line { display: block; }
.phrase__line + .phrase__line { margin-top: .5em; color: #f7f3ff; }
/* Cada palabra se revela con desvanecimiento + desenfoque (JS asigna --i) */
.word {
  display: inline-block;
  opacity: 0; filter: blur(8px); transform: translateY(.35em);
  animation: word-in 2.1s cubic-bezier(.22, .7, .2, 1) forwards;
  animation-delay: calc(1.6s + var(--i, 0) * .32s);
}
@keyframes word-in { to { opacity: 1; filter: blur(0); transform: none; } }

/* ============ Pista y control de música ============ */
.hint {
  position: fixed; left: 0; right: 0; z-index: 2;
  bottom: calc(30px + env(safe-area-inset-bottom, 0px));
  text-align: center; pointer-events: none;
  font: italic 300 1rem var(--serif); letter-spacing: .2em; color: var(--ink-soft);
  opacity: 0; animation: hint-in 3s 9.5s forwards;
}
.hint.is-hidden { animation: none; opacity: 0; transition: opacity 1s; }
@keyframes hint-in { to { opacity: .8; } }

.music {
  position: fixed; z-index: 3;
  right: calc(18px + env(safe-area-inset-right, 0px));
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  border: 1px solid rgba(185, 164, 255, .25);
  background: rgba(20, 16, 60, .35);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  opacity: .55; transition: opacity .4s, border-color .4s;
}
.music:hover, .music:focus-visible { opacity: 1; border-color: rgba(185, 164, 255, .6); }
.music:focus-visible { outline: 2px solid var(--lilac); outline-offset: 3px; }
.music__bars { display: flex; gap: 3px; align-items: center; height: 14px; }
.music__bars span {
  width: 2px; height: 14px; border-radius: 2px; background: var(--ink);
  transform: scaleY(.25);
}
.music.is-playing .music__bars span { animation: bar 1.3s ease-in-out infinite; }
.music.is-playing .music__bars span:nth-child(2) { animation-delay: -.5s; }
.music.is-playing .music__bars span:nth-child(3) { animation-delay: -.9s; }
@keyframes bar { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }

/* ============ Movimiento reducido ============ */
@media (prefers-reduced-motion: reduce) {
  .nebula, .moon::before, .music.is-playing .music__bars span { animation: none; }
  .word { animation: none; opacity: 1; filter: none; transform: none; }
  .hint { animation: none; opacity: .8; }
}
@media (max-width: 600px) {
  .moon { right: 9vw; top: calc(6vh + env(safe-area-inset-top, 0px)); }
  .hint { font-size: .9rem; letter-spacing: .14em; right: 70px; left: 70px; }
}
</style>
</head>
<body>

<div class="sky" aria-hidden="true"></div>
<div class="nebula nebula--violet" aria-hidden="true"></div>
<div class="nebula nebula--lilac" aria-hidden="true"></div>
<div class="nebula nebula--blue" aria-hidden="true"></div>
<canvas id="starfield" aria-hidden="true"></canvas>
<div class="moon" aria-hidden="true"></div>

<main class="stage">
  <p class="phrase">
    <span class="phrase__line">"Y entonces yo, en vez de</span>
    <span class="phrase__line">bajarte el cielo, te subí a el."</span>
  </p>
</main>

<p class="hint" id="hint">tocá el cielo</p>

<button class="music" id="musicBtn" type="button" aria-label="Reproducir música" aria-pressed="false">
  <span class="music__bars" aria-hidden="true"><span></span><span></span><span></span></span>
</button>

<script>
(() => {
  'use strict';

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (a, b) => a + Math.random() * (b - a);

  /* ============ 1. Frase: separar en palabras para revelarlas de a una ============ */
  let wordIndex = 0;
  document.querySelectorAll('.phrase__line').forEach(line => {
    const words = line.textContent.trim().split(/\s+/);
    line.textContent = '';
    words.forEach((w, k) => {
      const span = document.createElement('span');
      span.className = 'word';
      span.textContent = w;
      span.style.setProperty('--i', wordIndex++);
      line.append(span);
      if (k < words.length - 1) line.append(' ');
    });
    wordIndex += 2; // pausa entre las dos mitades de la frase
  });

  /* ============ 2. Cielo: estrellas, constelaciones, polvo, estrella fugaz ============ */
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;

  // Sprites precalculados: dibujar una imagen es mucho más barato que un gradiente por frame
  const makeSprite = rgb => {
    const s = document.createElement('canvas'); s.width = s.height = 64;
    const c = s.getContext('2d'), g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(.12, `rgba(${rgb},.95)`);
    g.addColorStop(.4, `rgba(${rgb},.18)`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    c.fillStyle = g; c.fillRect(0, 0, 64, 64);
    return s;
  };
  const sprites = [makeSprite('255,255,255'), makeSprite('200,180,255'), makeSprite('170,200,255')];

  // Tres capas: lejana (chica, lenta), media y cercana (grande, más parallax)
  const LAYERS = [
    { depth: .15, min: .5, max: .9, alpha: .55, share: .55 },
    { depth: .45, min: .8, max: 1.4, alpha: .75, share: .33 },
    { depth: 1,   min: 1.3, max: 2.3, alpha: .95, share: .12 }
  ];

  // Constelaciones en coordenadas normalizadas (0–1). La última: dos estrellas que coinciden.
  const CONSTELLATIONS = [
    { points: [[.12,.22],[.19,.31],[.27,.26],[.33,.37],[.24,.45]], edges: [[0,1],[1,2],[2,3],[1,4]] },
    { points: [[.70,.66],[.77,.60],[.84,.69],[.80,.80],[.72,.77]], edges: [[0,1],[1,2],[2,3],[3,4]] },
    { points: [[.46,.77],[.54,.74]], edges: [[0,1]] }
  ];

  let stars = [], dust = [], flashes = [], shoot = null;
  let nextShoot = 5000 + rand(0, 3000), last = 0, raf = 0;
  const par = { x: 0, y: 0 }, pointer = { x: 0, y: 0 };

  function buildSky() {
    const total = Math.min(420, Math.round(innerWidth * innerHeight / 5500));
    LAYERS.forEach(L => {
      for (let i = 0, n = Math.round(total * L.share); i < n; i++) {
        stars.push({
          nx: Math.random(), ny: Math.random(), r: rand(L.min, L.max),
          depth: L.depth, alpha: L.alpha,
          tint: Math.random() < .7 ? 0 : (Math.random() < .6 ? 1 : 2),
          phase: rand(0, 6.28), speed: rand(.5, 2.2), flash: 0, x: 0, y: 0
        });
      }
    });
    CONSTELLATIONS.forEach(c => {
      c.stars = c.points.map(([nx, ny]) => {
        const s = { nx, ny, r: rand(1.8, 2.3), depth: .45, alpha: 1, tint: 1,
                    phase: rand(0, 6.28), speed: rand(.6, 1.2), flash: 0, x: 0, y: 0 };
        stars.push(s); return s;
      });
    });
    for (let i = 0; i < 38; i++) {
      dust.push({ nx: Math.random(), ny: Math.random(), vx: rand(-.003, .003), vy: rand(-.006, -.001),
                  r: rand(.8, 2.2), phase: rand(0, 6.28) });
    }
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2); // limitar DPR cuida la batería
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    start();
  }

  const wrap = (v, m) => ((v % m) + m) % m;

  function launchShootingStar() {
    const dir = Math.random() < .5 ? 1 : -1, a = rand(.35, .6), sp = rand(750, 1000);
    shoot = { x: rand(.15, .85) * W, y: rand(0, .35) * H, vx: dir * Math.cos(a) * sp,
              vy: Math.sin(a) * sp, life: 0, sp };
  }

  function frame(t) {
    raf = 0;
    const dt = Math.min((t - last) / 1000 || 0, .05); last = t;
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    // Parallax suave: sigue al puntero y además se mece despacio sola (útil en el celular)
    if (!reduced) {
      par.x += ((pointer.x + Math.sin(t / 11000) * .5) - par.x) * .04;
      par.y += ((pointer.y + Math.cos(t / 13000) * .3) - par.y) * .04;
    }

    // Estrella al azar que titila más fuerte
    if (!reduced && Math.random() < .02) {
      const s = stars[(Math.random() * stars.length) | 0];
      if (s.r > 1) s.flash = Math.max(s.flash, .5);
    }

    // Estrellas
    for (const s of stars) {
      s.x = wrap(s.nx * W + par.x * s.depth * 26, W);
      s.y = wrap(s.ny * H + par.y * s.depth * 26, H);
      const tw = reduced ? .85 : .55 + .45 * Math.sin(t * .001 * s.speed + s.phase);
      const d = s.r * 6 * (1 + s.flash * 1.5);
      ctx.globalAlpha = Math.min(1, s.alpha * tw + s.flash);
      ctx.drawImage(sprites[s.tint], s.x - d / 2, s.y - d / 2, d, d);
      if (s.flash > 0) s.flash = Math.max(0, s.flash - dt * .9);
    }

    // Constelaciones: aparecen cuando la frase ya terminó de escribirse
    const reveal = reduced ? 1 : Math.max(0, Math.min(1, (t - 9000) / 5000));
    if (reveal > 0) {
      ctx.strokeStyle = 'rgb(200,185,255)'; ctx.lineWidth = 1;
      ctx.globalAlpha = reveal * (reduced ? .18 : .16 + .07 * Math.sin(t / 2500));
      ctx.beginPath();
      for (const c of CONSTELLATIONS) for (const [a, b] of c.edges) {
        ctx.moveTo(c.stars[a].x, c.stars[a].y); ctx.lineTo(c.stars[b].x, c.stars[b].y);
      }
      ctx.stroke();
    }

    // Partículas luminosas a la deriva
    for (const p of dust) {
      if (!reduced) { p.nx = wrap(p.nx + p.vx * dt, 1); p.ny = wrap(p.ny + p.vy * dt, 1); }
      const d = p.r * 8;
      ctx.globalAlpha = .22 + .18 * Math.sin(t * .0008 + p.phase);
      ctx.drawImage(sprites[1], p.nx * W - d / 2, p.ny * H - d / 2, d, d);
    }

    // Estrella fugaz ocasional
    if (!reduced) {
      if (!shoot && t > nextShoot) launchShootingStar();
      if (shoot) {
        shoot.life += dt / 1.1;
        shoot.x += shoot.vx * dt; shoot.y += shoot.vy * dt;
        const tx = shoot.x - shoot.vx / shoot.sp * 150, ty = shoot.y - shoot.vy / shoot.sp * 150;
        const g = ctx.createLinearGradient(tx, ty, shoot.x, shoot.y);
        g.addColorStop(0, 'rgba(200,185,255,0)'); g.addColorStop(1, 'rgba(255,255,255,1)');
        ctx.globalAlpha = Math.sin(Math.min(shoot.life, 1) * Math.PI);
        ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(shoot.x, shoot.y); ctx.stroke();
        if (shoot.life >= 1) { shoot = null; nextShoot = t + rand(9000, 18000); }
      }
    }

    // Destellos al tocar una estrella: anillo + pequeña cruz de luz
    flashes = flashes.filter(f => f.life < 1);
    for (const f of flashes) {
      f.life += dt / 1.3;
      const p = Math.min(f.life, 1), len = (1 - p) * 26 + 4;
      ctx.globalAlpha = (1 - p) * .9; ctx.strokeStyle = 'rgb(235,225,255)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, 6 + p * 34, 0, 6.283);
      ctx.moveTo(f.x - len, f.y); ctx.lineTo(f.x + len, f.y);
      ctx.moveTo(f.x, f.y - len); ctx.lineTo(f.x, f.y + len);
      ctx.stroke();
    }

    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    if (!reduced || flashes.length) start();   // con movimiento reducido solo se anima mientras haya destello
  }

  function start() { if (!raf && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); } }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else start();
  });
  let resizeTimer;
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });
  addEventListener('pointermove', e => {
    pointer.x = e.clientX / innerWidth - .5; pointer.y = e.clientY / innerHeight - .5;
  }, { passive: true });

  /* ============ 3. Música desde un archivo MP3 ============ */
  const audio = new Audio('musica.mp3');
  audio.loop = true;
  audio.preload = 'auto';
  audio.volume = 0.65;

  let musicStarted = false;

  const Music = {
    get started() { return musicStarted; },
    get playing() { return !audio.paused; },

    async play() {
      try {
        await audio.play();
        musicStarted = true;
      } catch (error) {
        console.error('No se pudo reproducir la música:', error);
      }
    },

    pause() {
      audio.pause();
    },

    async toggle() {
      if (audio.paused) {
        await this.play();
      } else {
        this.pause();
      }
      return !audio.paused;
    },

    chime() {
      // La música ahora es el MP3; no se generan campanitas adicionales.
    }
  };

  const btn = document.getElementById('musicBtn');
  const hint = document.getElementById('hint');
  function syncButton() {
    btn.classList.toggle('is-playing', Music.playing);
    btn.setAttribute('aria-pressed', String(Music.playing));
    btn.setAttribute('aria-label', Music.playing ? 'Pausar música' : 'Reproducir música');
  }
  btn.addEventListener('click', async () => { await Music.toggle(); hint.classList.add('is-hidden'); syncButton(); });

  /* ============ 4. Interacción: la primera caricia al cielo despierta la música ============ */
  addEventListener('pointerdown', async e => {
    if (e.target.closest('#musicBtn')) return;
    hint.classList.add('is-hidden');
    if (!Music.started) { await Music.play(); syncButton(); }   // inicia tras la primera interacción

    let best = null, bestDist = 34 * 34;                  // radio generoso para el dedo
    for (const s of stars) {
      if (s.r < 1.1) continue;
      const dx = s.x - e.clientX, dy = s.y - e.clientY, d = dx * dx + dy * dy;
      if (d < bestDist) { bestDist = d; best = s; }
    }
    if (best) {
      best.flash = 1;
      flashes.push({ x: best.x, y: best.y, life: 0 });
      Music.chime(best.x / W);
      start();
    }
  });

  buildSky();
  resize();
})();
</script>
</body>
</html>
